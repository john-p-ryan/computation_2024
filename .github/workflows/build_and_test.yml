name: Build and test
on:
  push:
    paths:
      - '**.yml'
      - '**.toml'
      - '**.lock'
      - '**.ini'
      - '**.py'
      - '**.json'
      - '**.csv'
      - '**.pkl'
      - '**.pbz2'
  pull_request:
    paths:
      - '**.yml'
      - '**.toml'
      - '**.lock'
      - '**.ini'
      - '**.py'
      - '**.json'
      - '**.csv'
      - '**.pkl'
      - '**.pbz2'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run python -m pytest -m "not local"
